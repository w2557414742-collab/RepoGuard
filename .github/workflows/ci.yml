name: RepoGuard CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version }}
      - run: python -m pip install '.[dev,refactor,testing,architecture,api,mcp]'
      - run: python -m ruff check .
      - run: python scripts/generate_source_guide.py --check
      - run: python -m pytest -q
      - run: python -m pip wheel --no-deps --wheel-dir dist .
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
