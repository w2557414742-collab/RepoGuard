[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repoguard"
version = "0.1.0"
description = "Versioned Python repository analysis and change impact evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["networkx>=3.3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "hypothesis>=6,<7", "httpx>=0.27,<1"]
refactor = ["libcst>=1.8,<2"]
testing = ["coverage>=7.8,<8"]
architecture = ["pyyaml>=6,<7"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1"]
mcp = ["mcp>=1.12,<2"]
verify = ["crosshair-tool>=0.0.85,<1"]

[project.scripts]
repoguard = "repoguard.cli:main"
repoguard-mcp = "repoguard.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".benchmark", "build", "dist", "frontend/node_modules"]
